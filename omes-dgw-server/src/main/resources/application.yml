server:
  port: ${SERVER_PORT:12020}
  forward-headers-strategy: framework

spring:
  application:
    name: omes-dgw-server
  config:
    import: optional:file:${omes.deploy.root:.}/config/config.properties
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: ALWAYS
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # 仅 store-backend=redis 且已引入 omes-dgw-plugin-redis 插件时生效；默认 caffeine 无 Redis 依赖
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  datasource:
    driver-class-name: org.sqlite.JDBC
    # 本地文件库；WAL + busy_timeout 减轻短时锁等待。父目录不存在时由 SqliteDataSourceConfig 创建
    url: jdbc:sqlite:${SQLITE_PATH:./data/omes-dgw.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    hikari:
      # SQLite 写并发弱，连接池保持单连接
      minimum-idle: 1
      maximum-pool-size: 1
      connection-timeout: 30000
      connection-init-sql: PRAGMA foreign_keys = ON
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    create-schemas: false
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 枚举通过 @EnumValue 字段值（字符串）入库
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      db-type: sqlite
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true

# 管理平台：用户、JWT、菜单均可在配置中维护，无需数据库
app:
  collect:
    # caffeine=本地 Caffeine+进程内队列；redis=需引入 omes-dgw-plugin-redis 插件并配置 REDIS_*
    monitor-type: ${COLLECT_MONITOR_TYPE:none}
    store-backend: ${COLLECT_STORE_BACKEND:caffeine}
    redis-key-prefix: ${COLLECT_REDIS_KEY_PREFIX:omes:dwg:device:realtime}
    polling-scheduler-pool-size: ${COLLECT_POLLING_SCHEDULER_POOL_SIZE:4}
    poll-skip-warn-threshold: ${COLLECT_POLL_SKIP_WARN_THRESHOLD:10}
    diagnostics:
      # 轮询耗时分解：always | on_issue | debug_only | off
      poll-timing-mode: ${COLLECT_DIAGNOSTICS_POLL_TIMING_MODE:on_issue}
      point-value-change-log-enabled: ${COLLECT_DIAGNOSTICS_POINT_VALUE_CHANGE:true}
      memory-log-enabled: ${COLLECT_DIAGNOSTICS_MEMORY_LOG:true}
      memory-log-interval-sec: ${COLLECT_DIAGNOSTICS_MEMORY_LOG_INTERVAL_SEC:300}
    connection:
      # 连续失败达到该次数后熔断；-1 表示永不断连
      max-consecutive-failures: ${COLLECT_CONNECTION_MAX_CONSECUTIVE_FAILURES:5}
      backoff-initial-ms: ${COLLECT_CONNECTION_BACKOFF_INITIAL_MS:10000}
      backoff-max-ms: ${COLLECT_CONNECTION_BACKOFF_MAX_MS:300000}
      backoff-multiplier: ${COLLECT_CONNECTION_BACKOFF_MULTIPLIER:2.0}
      # 熔断打开次数超过该值后放弃自动半开恢复（仅人工开启连接）
      max-open-retries: ${COLLECT_CONNECTION_MAX_OPEN_RETRIES:10}
      backoff-max-scale-steps: ${COLLECT_CONNECTION_BACKOFF_MAX_SCALE_STEPS:10}
      backoff-max-scale-factor: ${COLLECT_CONNECTION_BACKOFF_MAX_SCALE_FACTOR:0.1}
      # PLC4X 缓存连接租约（秒），需覆盖单轮多块 Modbus 读
      plc-connection-max-lease-sec: ${COLLECT_PLC_CONNECTION_MAX_LEASE_SEC:120}
      plc-connection-max-wait-sec: ${COLLECT_PLC_CONNECTION_MAX_WAIT_SEC:20}
      plc-connection-max-idle-sec: ${COLLECT_PLC_CONNECTION_MAX_IDLE_SEC:300}
      # 批量启用时相邻设备首次建连错开间隔（毫秒），避免同时打开大量连接
      batch-start-stagger-ms: ${COLLECT_CONNECTION_BATCH_START_STAGGER_MS:300}
    modbus-polling:
      max-merge-gap-registers: ${COLLECT_MODBUS_MAX_MERGE_GAP_REGISTERS:8}
      max-merge-gap-bits: ${COLLECT_MODBUS_MAX_MERGE_GAP_BITS:64}
      tag-batch-size: ${COLLECT_MODBUS_TAG_BATCH_SIZE:20}
      read-max-retries: ${COLLECT_MODBUS_READ_MAX_RETRIES:3}
      read-retry-delay-ms: ${COLLECT_MODBUS_READ_RETRY_DELAY_MS:300}
    slmp-polling:
      max-merge-gap-words: ${COLLECT_SLMP_MAX_MERGE_GAP_WORDS:8}
      max-merge-gap-bits: ${COLLECT_SLMP_MAX_MERGE_GAP_BITS:64}
      max-words-per-request: ${COLLECT_SLMP_MAX_WORDS_PER_REQUEST:960}
      max-bits-per-request: ${COLLECT_SLMP_MAX_BITS_PER_REQUEST:3584}
    fins-polling:
      max-merge-gap-words: ${COLLECT_FINS_MAX_MERGE_GAP_WORDS:8}
      max-words-per-read: ${COLLECT_FINS_MAX_WORDS_PER_READ:250}
      max-words-per-write: ${COLLECT_FINS_MAX_WORDS_PER_WRITE:80}
    offline:
      enabled: true
      check-delay-ms: ${COLLECT_OFFLINE_CHECK_DELAY_MS:30000}
      offline-timeout-ms: ${COLLECT_OFFLINE_TIMEOUT_MS:30000}
      scheduler-pool-size: ${COLLECT_OFFLINE_SCHEDULER_POOL_SIZE:4}
    metrics:
      queue-depth-refresh-ms: ${COLLECT_METRICS_QUEUE_DEPTH_REFRESH_MS:30000}
      offline-duration-refresh-ms: ${COLLECT_METRICS_OFFLINE_DURATION_REFRESH_MS:60000}
      sample-interval-sec: ${METRICS_SAMPLE_INTERVAL_SEC:1}
      # 内存环形缓冲保留时长（分钟）；与 chart 接口 minutes 查询窗独立，建议 >= 常用查询跨度
      history-minutes: 60
      persist-to-influx: ${METRICS_PERSIST_INFLUX:true}
      instance-id: ${METRICS_INSTANCE_ID:}
      influx-batch-size: ${METRICS_INFLUX_BATCH_SIZE:500}
      influx-flush-interval-sec: ${METRICS_INFLUX_FLUSH_INTERVAL_SEC:60}
      influx-max-queue-size: ${METRICS_INFLUX_MAX_QUEUE_SIZE:10000}
      influx-query-max-minutes: ${METRICS_INFLUX_QUERY_MAX_MINUTES:10080}
    # 新实时快照写入本地缓存后同步入队，达批量阈值后写入 Influx
    history:
      enabled: ${COLLECT_HISTORY_ENABLED:true}
      batch-size: ${COLLECT_HISTORY_BATCH_SIZE:200}
      flush-interval-sec: ${COLLECT_HISTORY_FLUSH_INTERVAL_SEC:60}
      max-queue-size: ${COLLECT_HISTORY_MAX_QUEUE_SIZE:50000}
      query-max-minutes: ${COLLECT_HISTORY_QUERY_MAX_MINUTES:10080}
      chart-max-points-per-series: ${COLLECT_HISTORY_CHART_MAX_POINTS:500}
      max-write-retries: ${COLLECT_HISTORY_MAX_WRITE_RETRIES:3}
    # 设备在线/离线状态变更写入 SQLite（仅状态变化时入队）
    online-event:
      enabled: ${COLLECT_ONLINE_EVENT_ENABLED:true}
      batch-size: ${COLLECT_ONLINE_EVENT_BATCH_SIZE:100}
      flush-interval-sec: ${COLLECT_ONLINE_EVENT_FLUSH_INTERVAL_SEC:30}
      max-queue-size: ${COLLECT_ONLINE_EVENT_MAX_QUEUE_SIZE:10000}
    # 控制点位写入：指令入库后由单线程按顺序执行
    point-write:
      enabled: ${COLLECT_POINT_WRITE_ENABLED:true}
      idle-poll-interval-ms: ${COLLECT_POINT_WRITE_IDLE_POLL_MS:500}
  # InfluxDB 2.x（需导入 omes-dgw-plugin-influx 插件后再启用）
  influx:
    url: ${INFLUX_URL:http://localhost:8086}
    token: ${INFLUX_TOKEN}
    org: ${INFLUX_ORG:omes}
    bucket: ${INFLUX_BUCKET:dgw_metrics}
    connect-timeout-ms: 10000
    read-timeout-ms: 10000
    write-timeout-ms: 10000
  security:
    jwt:
      secret: mGX8dXtX3/t8xucjIpA9gr4y+tGe/bzkDepbu72BrrFwMybHYasrzD5VMfJ8ilef
      expiration-ms: 86400000
    users:
      - username: admin
        password: admin123
        nickname: 系统管理员
        roles:
          - ADMIN
      - username: operator
        password: operator123
        nickname: 运营人员
        roles:
          - OPERATOR
  menus:
    - id: monitoring-overview
      title: 总览
      path: /monitoring/overview
      icon: monitor
      roles:
        - ADMIN
        - OPERATOR
    - id: equipment-overview
      title: 设备监控
      path: /equipment/overview
      icon: cluster
      roles:
        - ADMIN
        - OPERATOR
    - id: equipment-ledger
      title: 设备台账
      path: /equipment/ledger
      icon: setting
      roles:
        - ADMIN
        - OPERATOR
    - id: equipment-command
      title: 指令记录
      path: /equipment/command
      icon: profile
      roles:
        - ADMIN
    - id: system-runtime-config
      title: 系统配置
      path: /system/runtime-config
      icon: setting
      roles:
        - ADMIN

  deploy:
    config-file: ${DEPLOY_CONFIG_FILE:config/config.properties}
    plugins-dir: ${DEPLOY_PLUGINS_DIR:plugins}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      jdbc: true
  prometheus:
    metrics:
      export:
        enabled: true

# 日志由 log4j2-spring.xml 配置；可通过环境变量覆盖
# LOG_PATH=logs
logging:
  config: classpath:log4j2-spring.xml
