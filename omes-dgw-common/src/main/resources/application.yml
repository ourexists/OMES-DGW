    web:
      exposure:
        include: health,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      jvm: true
      jdbc: true
  prometheus:
    metrics:
      export:
        enabled: true

# 日志由 log4j2-spring.xml 配置；可通过环境变量覆盖
# LOG_PATH=logs
logging:
  config: classpath:log4j2-spring.xml
