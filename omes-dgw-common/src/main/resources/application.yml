server:
  port: ${SERVER_PORT:12020}
  forward-headers-strategy: framework

spring:
  application:
    name: omes-dgw
  # 外部配置由各门户 application.yml 的 spring.config.import 引入：
  #   box → config/config-box.properties；center → config/config-center.properties
  servlet:
    multipart:
      max-file-size: 64MB
      max-request-size: 64MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: ALWAYS
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # Redis 连接由中控门户 application.yml 提供（omes-dgw-portal-center）
  datasource:
    driver-class-name: org.sqlite.JDBC
    # 本地文件库；WAL + busy_timeout 减轻短时锁等待。父目录不存在时由 SqliteDataSourceConfig 创建
    url: jdbc:sqlite:${SQLITE_PATH:./data/omes-dgw.db}?journal_mode=WAL&busy_timeout=5000&foreign_keys=on
    hikari:
      # SQLite 写并发弱，连接池保持单连接
      minimum-idle: 1
      maximum-pool-size: 1
      connection-timeout: 30000
      connection-init-sql: PRAGMA foreign_keys = ON
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    create-schemas: false
    baseline-on-migrate: true
    baseline-version: 0

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    # 枚举通过 @EnumValue 字段值（字符串）入库
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
  global-config:
    db-config:
      db-type: sqlite
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      table-underline: true

