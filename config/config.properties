# =============================================================================
# OMES DGW 运行配置（JAR 同级 config/config.properties）
# 推荐在管理端维护：
#   - 插件管理：Redis / Influx 插件及全部相关项
#   - 系统配置：SQLite、采集调度、熔断、Modbus、离线、在线事件、点位写入等
# 保存后多数项需重启生效。
# =============================================================================

# --- 内置：SQLite ---
SQLITE_PATH=./data/omes-dgw.db
FLYWAY_ENABLED=true

# --- 内置：采集调度 / 诊断 ---
COLLECT_POLLING_SCHEDULER_POOL_SIZE=8
COLLECT_DIAGNOSTICS_POLL_TIMING_MODE=on_issue
COLLECT_DIAGNOSTICS_POINT_VALUE_CHANGE=true
COLLECT_DIAGNOSTICS_MEMORY_LOG=true
COLLECT_DIAGNOSTICS_MEMORY_LOG_INTERVAL_SEC=300

# --- 内置：连接熔断 ---
COLLECT_CONNECTION_MAX_CONSECUTIVE_FAILURES=5
COLLECT_CONNECTION_BACKOFF_INITIAL_MS=10000
COLLECT_CONNECTION_BACKOFF_MAX_MS=300000
COLLECT_CONNECTION_BACKOFF_MULTIPLIER=2.0
COLLECT_CONNECTION_MAX_OPEN_RETRIES=10
COLLECT_CONNECTION_BACKOFF_MAX_SCALE_STEPS=10
COLLECT_CONNECTION_BACKOFF_MAX_SCALE_FACTOR=0.1
COLLECT_PLC_CONNECTION_MAX_LEASE_SEC=120
COLLECT_PLC_CONNECTION_MAX_WAIT_SEC=20
COLLECT_PLC_CONNECTION_MAX_IDLE_SEC=300
COLLECT_CONNECTION_BATCH_START_STAGGER_MS=300

# --- 内置：Modbus ---
COLLECT_MODBUS_MAX_MERGE_GAP_REGISTERS=8
COLLECT_MODBUS_MAX_MERGE_GAP_BITS=64
COLLECT_MODBUS_TAG_BATCH_SIZE=20
COLLECT_MODBUS_READ_MAX_RETRIES=3
COLLECT_MODBUS_READ_RETRY_DELAY_MS=300

# --- 内置：离线检测 ---
COLLECT_OFFLINE_CHECK_DELAY_MS=30000
COLLECT_OFFLINE_TIMEOUT_MS=30000
COLLECT_OFFLINE_SCHEDULER_POOL_SIZE=8

# --- 内置：运行指标（采样；写入 Influx 见插件管理）---
METRICS_SAMPLE_INTERVAL_SEC=10
COLLECT_METRICS_QUEUE_DEPTH_REFRESH_MS=30000
COLLECT_METRICS_OFFLINE_DURATION_REFRESH_MS=60000

# --- 内置：在线事件 / 点位写入 ---
COLLECT_ONLINE_EVENT_ENABLED=true
COLLECT_ONLINE_EVENT_BATCH_SIZE=100
COLLECT_ONLINE_EVENT_FLUSH_INTERVAL_SEC=30
COLLECT_ONLINE_EVENT_MAX_QUEUE_SIZE=10000
COLLECT_POINT_WRITE_ENABLED=true
COLLECT_POINT_WRITE_IDLE_POLL_MS=500

# --- Redis 插件（插件管理页维护；无插件时保持 caffeine）---
COLLECT_STORE_BACKEND=redis

# --- 采集监控类型：none（无，默认）、influxdb（需安装插件）---
COLLECT_MONITOR_TYPE=none

# --- updated by OMES DGW admin UI ---
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_PASSWORD=waqwertyuiop!
REDIS_DATABASE=0
