# 实施部署包：先 load images/*.tar，再在本目录 compose up
# 客户已装 Influx 时：.env 中 USE_BUNDLED_INFLUX=false 并填写外部地址（默认即外部）
# 需 compose 自带 Influx 时：USE_BUNDLED_INFLUX=true 后启动

name: omes-dgw

services:
  influxdb:
    profiles: ["bundled-influx"]
    image: influxdb:2.7-alpine
    container_name: omes-dgw-influxdb
    restart: unless-stopped
    ports:
      - "${INFLUX_PUBLISH_PORT:-8086}:8086"
    volumes:
      - ${MOUNT_PATH:?MOUNT_PATH must be set}/influxdb2:/var/lib/influxdb2
      - ${MOUNT_PATH:?MOUNT_PATH must be set}/influxdb2/etc:/etc/influxdb2
    environment:
      TZ: Asia/Shanghai
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-admin123456}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG:-omes}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET:-collect_metrics}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:-collect-dev-influx-token-change-me}
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8086/health | grep -q pass || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  omes-dgw-server:
    image: omes-dgw-server:1.0-SNAPSHOT
    container_name: omes-dgw-server
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
        required: false
    ports:
      - "${APP_PUBLISH_PORT:-12010}:12010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SERVER_PORT: "12010"
      APP_DEPLOY_RESTART_SUPERVISED: "true"
      LOG_PATH: /app/logs
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*,http://127.0.0.1:*}
      SQLITE_PATH: ${SQLITE_PATH:-/app/data/omes-dgw.db}
      FLYWAY_ENABLED: ${FLYWAY_ENABLED:-true}
      COLLECT_MONITOR_TYPE: ${COLLECT_MONITOR_TYPE:-none}
      INFLUX_URL: ${INFLUX_URL:-http://host.docker.internal:8086}
      INFLUX_TOKEN: ${INFLUX_ADMIN_TOKEN:-collect-dev-influx-token-change-me}
      INFLUX_ORG: ${INFLUX_ORG:-omes}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-collect_metrics}
      JAVA_OPTS: ${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    volumes:
      - ${MOUNT_PATH:?MOUNT_PATH must be set}/omes-dgw/config:/app/config
      - ${MOUNT_PATH:?MOUNT_PATH must be set}/omes-dgw/monitoring:/app/monitoring
      - ${MOUNT_PATH:?MOUNT_PATH must be set}/omes-dgw/logs:/app/logs
      - ${MOUNT_PATH:?MOUNT_PATH must be set}/omes-dgw/data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:12010/actuator/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  omes-dgw-web:
    image: omes-dgw-web:1.0.0
    container_name: omes-dgw-web
    restart: unless-stopped
    depends_on:
      omes-dgw-server:
        condition: service_healthy
    ports:
      - "${FRONT_PUBLISH_PORT:-12011}:80"
    volumes:
      - ${MOUNT_PATH:?MOUNT_PATH must be set}/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MOUNT_PATH:?MOUNT_PATH must be set}/nginx/logs:/var/log/nginx
